<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="300" viewBox="0 0 1100 300" role="img" aria-labelledby="title desc"><title id="title">OpenCV gray detector pipeline</title><desc id="desc">Camera BGR frame converted to HSV, thresholded with inRange, then applied as a bitwise mask.</desc><rect width="1100" height="300" fill="#0d1117"/><style>.b{fill:#161b22;stroke:#58a6ff;stroke-width:2;rx:14}.t{fill:#f0f6fc;font:600 18px system-ui,-apple-system,Segoe UI,sans-serif}.s{fill:#8b949e;font:14px system-ui,-apple-system,Segoe UI,sans-serif}.l{stroke:#8b949e;stroke-width:3;fill:none;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8b949e"/></marker></defs><text x="35" y="42" class="t">Gray detection pipeline</text><text x="35" y="68" class="s">Exact stages implemented in src/gray_detector.py</text><rect x="35" y="115" width="190" height="90" class="b"/><text x="78" y="150" class="t">BGR Frame</text><text x="65" y="176" class="s">camera / image input</text><rect x="300" y="115" width="190" height="90" class="b"/><text x="350" y="150" class="t">HSV</text><text x="330" y="176" class="s">cvtColor</text><rect x="565" y="115" width="190" height="90" class="b"/><text x="601" y="150" class="t">Binary Mask</text><text x="610" y="176" class="s">inRange</text><rect x="830" y="115" width="220" height="90" class="b"/><text x="873" y="150" class="t">Masked Output</text><text x="880" y="176" class="s">bitwise_and</text><path d="M225 160 H300" class="l"/><path d="M490 160 H565" class="l"/><path d="M755 160 H830" class="l"/></svg>